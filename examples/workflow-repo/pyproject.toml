[project]
name = "example-workflow-repo"
version = "0.1.0"
description = "Starter workflow repository for SAGE Run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sage-run==1.0.5",
]

[dependency-groups]
dev = [
    "fastmcp>=3.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

