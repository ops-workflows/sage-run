# SAGE Run starter platform configuration.
# Edit the plain `config:` values directly for local development.
# Keep sensitive values in `secrets:` encrypted with age.
#
# The private key is ~/.config/sage-run/dev.agekey locally and
# /etc/sage-run/<instance>/age.key on the production host. Only public
# recipients belong in Git. Replace every placeholder before deploying.

config:
  INSTANCE_NAME: local-sage-run

  AGE_PUBLIC_KEY: age1examplepublickeyreplacewithyourgeneratedrecipient

  PG_HOST: postgres
  PG_PORT: "5432"
  PG_DB: sage_run
  PG_USER: sage_run

  OBJECT_STORE_PROVIDER: s3
  OBJECT_STORE_ENDPOINT: minio:9000
  OBJECT_STORE_ACCESS_KEY: sage_run

  # Caps concurrently admitted parent tasks across every workflow. This does
  # not cap concurrent subagent/model calls within a running task.
  PLATFORM_MAX_RUNNING_TASKS: "3"

deployment:
  public_url: http://my-workflows-dev.localhost
  sandbox_profile: local
  hindsight:
    env:
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://llm.example.internal/v1
      HINDSIGHT_API_LLM_MODEL: replace-with-reflection-model
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: https://llm.example.internal/v1
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: replace-with-embedding-model

# Workflows select these by name; .mcp.json expands their per-task values.
connections:
  custom-example:
    workflows: [example-workflow]
    env:
      CUSTOM_EXAMPLE_BASE_URL: https://service.example.com
    secrets:
      CUSTOM_EXAMPLE_TOKEN:
        encrypted: ENC[age,replace-with-encrypted-development-service-token]

# Optional identity-provider group translation for the user-info API. External
# names are matched exactly; only the canonical application group names are
# returned to the UI. These groups are informational and do not enforce RBAC.
identity:
  group_mapping:
    platform-admin:
      - replace-with-idp-platform-admin-group
    workflow-operator:
      - replace-with-idp-workflow-operator-group
    task-viewer:
      - replace-with-idp-task-viewer-group

# Platform-owned GitHub App installations. Use one named connection per App
# installation; repositories select a connection by name. GitHub.com and GHES
# require separate Apps, app ids, installation ids, and private keys.
github:
  workflow_repo_connection: github-public
  connections:
    github-public:
      web_base_url: https://github.com
      api_base_url: https://api.github.com
      app_id: "replace-with-app-id"
      installation_id: "replace-with-installation-id"
      private_key_secret: github_public_app_private_key
    # github-enterprise:
    #   web_base_url: https://github.company.example
    #   api_base_url: https://github.company.example/api/v3
    #   app_id: "replace-with-ghes-app-id"
    #   installation_id: "replace-with-ghes-installation-id"
    #   private_key_secret: github_enterprise_app_private_key

confluence:
  connections:
    team-wiki:
      base_url: https://example.atlassian.net/wiki
      auth_type: basic
      username: knowledge-reader@example.com
      token_secret: CONFLUENCE_TEAM_TOKEN
    # Confluence Data Center uses its context path and a personal access token:
    # corporate-wiki:
    #   deployment: data_center
    #   base_url: https://confluence.example.com/confluence
    #   auth_type: bearer
    #   token_secret: CONFLUENCE_DC_TOKEN

# Use the same endpoint/model as Hindsight, with its verified output dimension.
# 0 leaves hybrid indexing unconfigured; deployment env overrides this section.
knowledge:
  embeddings:
    provider: openai_compatible
    base_url: https://llm.example.internal/v1
    model: example-embedding-model
    dimensions: 0
  rerank:
    enabled: false
  require_explicit_source_grants: false

mcps:
  enabled:
    - message
    - memory
    - platform
    - knowledge
    - custom-example
  # Instance-specific MCP policy lives under `config.<server_id>`, e.g.:
  # config:
  #   salesforce:
  #     api_version: v60.0
  #     allowed_objects: [Account, Case, Contact]
  #   splunk:
  #     max_results: 500
  #     max_window_hours: 24
  #     max_evidence_bytes: 65536
  #   evidence:
  #     redaction_patterns:
  #       - pattern: 'customer-[A-Z0-9]+'
  #         replacement: '<customer>'
  #   cloudwatch:
  #     allowed_regions: [eu-west-1]
  #     allowed_account_ids: ['123456789012']
  #     allowed_log_groups: [/aws/lambda/production-api]
  #     allowed_log_group_prefixes: []
  #     alarm_log_group_mappings:
  #       production-apiAlarm: [/aws/lambda/production-api]
  #     max_results: 500
  #     max_window_hours: 24
  #     max_scan_bytes: 536870912
  #     max_evidence_bytes: 65536
  #   github:
  #     allowed_hosts: [api.github.com, github.company.example]
  #     max_results: 20
  #     max_excerpt_lines: 200
  #     max_file_bytes: 1048576

connectors:
  # `enabled` lists connector instance ids defined under `instances`.
  enabled: []
  instances: {}
  # instances:
  #   example-intake:
  #     type: gcp-pubsub
  #     source:
  #       type: pubsub
  #       project: ${GCP_PROJECT}
  #       subscription: ${GCP_PUBSUB_SUBSCRIPTION}
  #       gcs_payload:                    # optional GCS object referenced by the Pub/Sub message
  #         enabled: true
  #         bucket_field: bucket
  #         name_field: name
  #         metadata_key: email_text
  #         max_bytes: 200000
  #         parser: email                 # `text` (default) or RFC 822/MIME email parsing
  #         max_body_chars: 4000          # `email` only: text/plain preferred, HTML fallback
  #     target:
  #       workflow: example-workflow
  #     parsing:
  #       email_extract:                  # optional regexes over parsed headers and body
  #         incident_id: "Incident: ([A-Z0-9-]+)"
  #         description: body

message_bus:
  # Supported providers: mattermost, slack.
  provider: mattermost
  api_url: http://mattermost:8065
  team_name: platform
  bot_token_secret: message_bus_bot_token
  # Required only for Slack Socket Mode.
  app_token_secret: message_bus_app_token
  # Required only for Mattermost interactive approval buttons.
  action_callback_secret: message_action_callback_secret

# To use Slack instead, replace the message_bus mapping above with:
# message_bus:
#   provider: slack
#   api_url: https://slack.com/api
#   bot_token_secret: message_bus_bot_token
#   app_token_secret: message_bus_app_token
#
# Slack requires a bot token with chat:write, channels:read, groups:read, and
# access to every configured messaging.channels channel. It also requires a
# Socket Mode app token. action_callback_secret is not used by Slack.
# Mattermost requires the bot token and api_url; team_name selects ambiguous
# channel names. Its approval buttons call the public gateway callback URL and
# use action_callback_secret as a gateway-internal callback value.

runtime_bundles:
  storage: s3
  bucket: sage-run-bundles
  retention_versions: 20

# These env vars are injected into every ephemeral agent runtime container.
# Use `null` to explicitly remove a built-in runtime env var.
# Keep workflow-independent flags here. Model-specific values can live under
# model_profiles and be selected from a workflow's session.model.
runtime_env:
  ANTHROPIC_API_KEY: null
  DISABLE_TELEMETRY: true
  DISABLE_ERROR_REPORTING: true
  DISABLE_FEEDBACK_COMMAND: true
  CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: true
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: true
  CLAUDE_CODE_DISABLE_TERMINAL_TITLE: true

# If a workflow omits session.model, this profile is used automatically.
default_model_profile: example

# Workflows can set session.model to a profile name such as `example`. If no
# matching profile exists, the value is treated as a direct
# model name and applied to ANTHROPIC_MODEL plus the Claude Code defaults.
# String values of the form `${ENV_VAR}` are resolved from the service process
# environment at load time, which is useful for local provider API keys.
model_profiles:
  example:
    ANTHROPIC_BASE_URL: https://model-gateway.example.internal
    ANTHROPIC_AUTH_TOKEN: ${LLM_API_KEY}
    ANTHROPIC_MODEL: example-model
    ANTHROPIC_DEFAULT_OPUS_MODEL: example-model
    ANTHROPIC_DEFAULT_SONNET_MODEL: example-model
    ANTHROPIC_DEFAULT_HAIKU_MODEL: example-model
    CLAUDE_CODE_SUBAGENT_MODEL: example-model
    CLAUDE_CODE_THINKING_MODE: default
    CLAUDE_CODE_MAX_OUTPUT_TOKENS: "8192"
    CLAUDE_CODE_MAX_CONTEXT_TOKENS: "65536"
    CLAUDE_CODE_AUTO_COMPACT_WINDOW: "65536"
    CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "90"
    # Optional prices in USD per million tokens for Claude Code's cost estimate;
    # cache_read/cache_write default to input. Keep in sync with the gateway.
    model_costs:
      example-model: {input: 0.15, output: 1, cache_read: 0.05}

memory:
  backend: hindsight
  banks:
    business: {}
    learning: {}

secrets:
  LLM_API_KEY:
    encrypted: ENC[age,replace-with-encrypted-development-model-key]
  PG_PASSWORD:
    encrypted: ENC[age,replace-with-encrypted-development-database-password]
  OBJECT_STORE_SECRET_KEY:
    encrypted: ENC[age,replace-with-encrypted-development-object-store-password]
  github_public_app_private_key:
    encrypted: ENC[age,replace-with-encrypted-github-app-private-key-pem]
  CONFLUENCE_TEAM_TOKEN:
    encrypted: ENC[age,replace-with-encrypted-confluence-api-token]
  # github_enterprise_app_private_key:
  #   encrypted: ENC[age,replace-with-encrypted-ghes-app-private-key-pem]
  message_bus_bot_token:
    encrypted: ENC[age,replace-with-encrypted-token]
  message_bus_app_token:
    encrypted: ENC[age,replace-with-encrypted-app-token]
  message_action_callback_secret:
    encrypted: ENC[age,replace-with-encrypted-action-secret]
  # GCP connectors use this when Kubernetes workload identity is unavailable.
  # It is materialized as a temporary ADC file inside the connector process.
  GCP_SERVICE_ACCOUNT_JSON:
    encrypted: ENC[age,replace-with-encrypted-service-account-json]
