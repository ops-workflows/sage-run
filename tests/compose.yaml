# Isolated test database only; never a platform serving stack.
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${PGUSER:-sage_run}
      POSTGRES_PASSWORD: ${PGPASSWORD:-localdev-postgres-password}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - sage-run-network
networks:
  sage-run-network:
    name: ${DOCKER_NETWORK:-sage-run-test-network}
