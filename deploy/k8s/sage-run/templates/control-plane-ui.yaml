apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sage-run.fullname" . }}-control-plane-ui
  labels:
    app.kubernetes.io/component: control-plane-ui
spec:
  replicas: {{ .Values.controlPlaneUi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane-ui
    spec:
      {{- include "sage-run.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: control-plane-ui
          image: {{ .Values.images.controlPlaneUi.repository }}:{{ .Values.images.controlPlaneUi.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlaneUi.port }}
          env:
            - name: INTERNAL_GATEWAY_URL
              value: http://{{ include "sage-run.fullname" . }}-gateway:{{ .Values.gateway.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sage-run.fullname" . }}-control-plane-ui
spec:
  selector:
    app.kubernetes.io/component: control-plane-ui
  ports:
    - name: http
      port: {{ .Values.controlPlaneUi.port }}
      targetPort: http
