{{- /* MCP servers defined in the workflow repository (mcps/<dir>/mcp_*.py), run from
       the platform MCP image with their source read from the workflow checkout. */}}
{{- range $name, $mcp := .Values.workflowMcps }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-{{ $name }}
  labels:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: {{ $name }}
    sage-run/source: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- include "sage-run.podDefaults" $ | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "sage-run.image" (dict "root" $ "component" "mcp") }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          workingDir: /app/workflows/{{ $mcp.dir }}
          command: ["python", "-m", "uvicorn", "{{ $mcp.module }}:app", "--host", "0.0.0.0", "--port", "{{ $mcp.port }}"]
          ports:
            - name: http
              containerPort: {{ $mcp.port }}
          env:
            {{- include "sage-run.commonEnv" $ | nindent 12 }}
            - name: PYTHONPATH
              value: "/app/workflows/{{ $mcp.dir }}:/app"
            {{- include "sage-run.serviceEnv" (dict "root" $ "name" (printf "mcp-%s" $name)) | nindent 12 }}
          envFrom:
            {{- include "sage-run.bootstrapEnvFrom" $ | nindent 12 }}
          volumeMounts:
            {{- include "sage-run.workflowRepoMount" (dict "writable" false) | nindent 12 }}
      volumes:
        {{- include "sage-run.workflowRepoVolume" $ | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-{{ $name }}
spec:
  selector:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $mcp.port }}
      targetPort: http
---
{{- end }}
