{{- if .Values.mcps.knowledge.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-cache
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "sage-run.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.knowledgeMcp.storageSize }}
{{- end }}
