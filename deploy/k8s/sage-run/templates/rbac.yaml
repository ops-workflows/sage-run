apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sage-run.serviceAccountName" . }}
---
# Gateway and session-manager launch, inspect and cancel agent-session Jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sage-run-sessions
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sage-run-sessions
subjects:
  - kind: ServiceAccount
    name: {{ include "sage-run.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sage-run-sessions
