apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  labels:
    app.kubernetes.io/component: session-manager
spec:
  replicas: {{ .Values.sessionManager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: session-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/component: session-manager
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: session-manager
          image: {{ include "sage-run.image" (dict "root" . "component" "session-manager") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            {{- include "sage-run.commonEnv" . | nindent 12 }}
            - name: RUNTIME_BUNDLE_ROOT
              value: {{ .Values.runtimeBundles.root | quote }}
            - name: RUNTIME_BUNDLE_OBJECT_STORE_BUCKET
              value: {{ .Values.runtimeBundles.objectStoreBucket | quote }}
            - name: RUNTIME_IMAGE
              value: {{ include "sage-run.image" (dict "root" . "component" "agent-runtime") | quote }}
            - name: SANDBOX_MODE
              value: {{ .Values.runtime.sandboxProfile | quote }}
            - name: KUBERNETES_RUNTIME_CLASS
              value: {{ .Values.runtime.runtimeClass | quote }}
            - name: KUBERNETES_RUNTIME_UID
              value: {{ .Values.runtime.uid | quote }}
            - name: KUBERNETES_RUNTIME_TTL_SEC
              value: {{ .Values.runtime.ttlSecondsAfterFinished | quote }}
            - name: KUBERNETES_MEMORY_HELPER_IMAGE
              value: {{ include "sage-run.image" (dict "root" . "component" "session-manager") | quote }}
            - name: KUBERNETES_BOOTSTRAP_SECRET
              value: {{ .Values.bootstrap.existingSecret | quote }}
            {{- include "sage-run.serviceEnv" (dict "root" $ "name" "session-manager") | nindent 12 }}
          envFrom:
            {{- include "sage-run.bootstrapEnvFrom" . | nindent 12 }}
          volumeMounts:
            {{- include "sage-run.workflowRepoMount" (dict "writable" false) | nindent 12 }}
            - name: release-cache
              mountPath: {{ .Values.runtimeBundles.root }}
      volumes:
        {{- include "sage-run.workflowRepoVolume" . | nindent 8 }}
        - name: release-cache
          emptyDir: {}
