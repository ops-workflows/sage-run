name: Publish release

"on":
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  package:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          version="$(uv version --short)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Unsupported release version: %s\n' "$version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Release tag %s must match package version v%s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from twine twine check --strict dist/*

      - name: Verify installed operator wheel
        run: |
          uv venv "$RUNNER_TEMP/sage-run-operator" --python 3.11
          uv pip install --python "$RUNNER_TEMP/sage-run-operator/bin/python" dist/*.whl
          "$RUNNER_TEMP/sage-run-operator/bin/python" -I -m sage_run --version
          "$RUNNER_TEMP/sage-run-operator/bin/python" -I -c "from importlib.util import find_spec; assert find_spec('claude_agent_sdk') is None; assert find_spec('gateway') is None"

      - name: Store Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  images:
    name: Publish ${{ matrix.component }} image
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: gateway
            dockerfile: gateway/Dockerfile
          - component: session-manager
            dockerfile: session-manager/Dockerfile
          - component: knowledge-indexer
            dockerfile: knowledge-indexer/Dockerfile
          - component: gcp-pubsub-connector
            dockerfile: connectors/gcp-pubsub-connector/Dockerfile
          - component: servicenow-connector
            dockerfile: connectors/servicenow-connector/Dockerfile
          - component: control-plane-ui
            dockerfile: control-plane-ui/Dockerfile
            context: control-plane-ui
          - component: mcp
            dockerfile: mcps/Dockerfile
          - component: agent-runtime
            dockerfile: runtime/Dockerfile
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ needs.package.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.package.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

  pypi:
    name: Publish to PyPI
    needs: [package, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sage-run
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    name: Attach Python distributions
    needs: [package, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Attach wheel and source distribution to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*
