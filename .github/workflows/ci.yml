name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      runtime_diagnostics:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      runtime_diagnostics:
        description: Print runtime container logs and slow-test durations
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane-ui/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --extra server --extra kubernetes
          npm --prefix control-plane-ui ci

      - name: Verify installed operator wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/sage-run-dist"
          uv venv "$RUNNER_TEMP/sage-run-operator" --python 3.11
          uv pip install --python "$RUNNER_TEMP/sage-run-operator/bin/python" "$RUNNER_TEMP"/sage-run-dist/*.whl
          "$RUNNER_TEMP/sage-run-operator/bin/python" -I -m sage_run --version
          mkdir -p "$RUNNER_TEMP/sage-run-workflows/workflows"
          cp -R "$GITHUB_WORKSPACE/tests/fixtures/repo-root/workflows/platform-test" "$RUNNER_TEMP/sage-run-workflows/workflows/platform-test"
          "$RUNNER_TEMP/sage-run-operator/bin/python" -I -m sage_run validate "$RUNNER_TEMP/sage-run-workflows"
          "$RUNNER_TEMP/sage-run-operator/bin/python" -I -c "from importlib.util import find_spec; assert find_spec('claude_agent_sdk') is None; assert find_spec('gateway') is None"

      - name: Lint
        run: make lint

      - name: UI contract and encryption tests
        run: npm --prefix control-plane-ui test

      - name: Build a service image
        run: docker buildx build --load -t sage-run-gateway:ci -f gateway/Dockerfile .

      - name: Lint and render Helm chart
        run: |
          helm lint sage_run/chart --set workflowRepo.hostPath=/workflows
          helm template sage-run sage_run/chart --set workflowRepo.hostPath=/workflows >/dev/null

      - name: Run full test suite
        run: >-
          make tests
          SANDBOX_MODE=gha
          PYTEST_FLAGS="-vv -ra${{ inputs.runtime_diagnostics && ' --durations=25' || '' }}"
        env:
          PYTHONUNBUFFERED: "1"
          RUNTIME_TEST_DEBUG: ${{ inputs.runtime_diagnostics && '1' || '0' }}
          RUNTIME_BUILD: >-
            docker buildx build --load --cache-from=type=gha
            --cache-to=type=gha,mode=max