# SAGE Run instance chart. One release per namespace; stable Service names
# (gateway, postgres, minio, hindsight, mcp-<id>) match workflow MCP URLs.

images:
  # Image reference: <registry>/<prefix><component>:<tag>. Local builds use an
  # empty registry, e.g. sage-run-gateway:dev-<sha>.
  registry: ghcr.io/ops-workflows
  prefix: sage-run-
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
  # Full image references per component, overriding the pattern above.
  overrides: {}

# Secret with AGE_IDENTITY, LLM_API_KEY, PG_PASSWORD and OBJECT_STORE_SECRET_KEY,
# injected into platform workloads.
bootstrap:
  existingSecret: sage-run-bootstrap

# The single workflow-repository checkout for this instance, mounted at
# /app/workflows. Its platform-config.yaml configures the platform.
workflowRepo:
  # Local development: absolute path of the working tree on the node.
  hostPath: ""
  # Production: PVC written by the deployer.
  existingClaim: ""
  source: local
  url: ""
  ref: ""

# Config environment: "" uses platform-config.yaml; e.g. prod merges
# platform-config-prod.yaml and needs that environment's key.
environment: ""

deployer:
  # Remote CLI enables this once the serving checkout is deployment-managed.
  enabled: false

backups:
  enabled: false
  # Root-owned directory on the single serving node; never the legacy archive parent.
  hostPath: ""
  schedule: "0 2 * * *"

# Legacy fallback for manually supplied values; the CLI supplies per-workload hashes.
configChecksum: ""
configChecksums: {}

# Extra non-secret environment for every platform workload.
env: {}

# Extra environment per workload, keyed by Deployment name (e.g. mcp-splunk).
serviceEnv: {}

# /etc/hosts entries for every platform pod: [{ip: 10.0.0.1, hostnames: [host]}].
hostAliases: []

runtime:
  # Session sandbox profile: local, ci or gvisor.
  sandboxProfile: gvisor
  runtimeClass: gvisor
  uid: 1000
  ttlSecondsAfterFinished: 86400

# Optional Ingress for the control plane (UI) and Gateway webhooks.
ingress:
  enabled: false
  host: ""
  className: ""

gateway:
  port: 8080

sessionManager:
  replicas: 1

controlPlaneUi:
  port: 3000
  # Publish the UI on a node address without an ingress controller (e.g. 80).
  hostPort: 0
  hostIP: ""

knowledgeSources:
  objectStoreBucket: sage-run-knowledge-sources

knowledgeIndexer:
  enabled: true
  cacheRoot: /var/lib/sage-run/knowledge-indexer

knowledgeMcp:
  cacheRoot: /var/lib/sage-run/knowledge
  storageSize: 20Gi

runtimeBundles:
  root: /var/lib/sage-run/releases
  objectStoreBucket: sage-run-bundles

infrastructure:
  storageClass: ""
  postgres:
    enabled: true
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    database: sage_run
    user: sage_run
    storageSize: 20Gi
  objectStore:
    enabled: true
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    accessKey: sage_run
    buckets:
      - agent-memory
      - sage-run-bundles
      - sage-run-knowledge-sources
    storageSize: 20Gi
  hindsight:
    enabled: true
    image: ghcr.io/vectorize-io/hindsight:latest@sha256:84ab276b8f501546deb6ea9c64a57291718b4e16a59dd9e02a02fdd5adfe9028
    storageSize: 10Gi
    # HINDSIGHT_API_* settings (LLM and embeddings endpoints and models).
    env: {}

# Platform MCP servers. The CLI enables them from platform-config.yaml.
mcps:
  message: {enabled: true, module: mcps.core.mcp_message, port: 8100}
  memory: {enabled: true, module: mcps.core.mcp_memory, port: 8103}
  knowledge: {enabled: true, module: mcps.core.mcp_knowledge, port: 8108}
  platform: {enabled: true, module: mcps.core.mcp_platform, port: 8105}
  salesforce: {enabled: false, module: mcps.integrations.mcp_salesforce, port: 8102}
  splunk: {enabled: false, module: mcps.integrations.mcp_splunk, port: 8101}
  cloudwatch: {enabled: false, module: mcps.integrations.mcp_cloudwatch, port: 8104}
  gcp-logging: {enabled: false, module: mcps.integrations.mcp_gcp_logging, port: 8109}
  jira: {enabled: false, module: mcps.integrations.mcp_jira, port: 8106}
  github: {enabled: false, module: mcps.integrations.mcp_github, port: 8107}

connectors:
  servicenow: {enabled: false, component: servicenow-connector}
  gcp-pubsub: {enabled: false, component: gcp-pubsub-connector}

# Workflow-defined MCP servers, derived by the CLI: {id: {dir, module, port}}.
workflowMcps: {}
