{{- $infra := .Values.infrastructure }}
{{- if $infra.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init_db.sql: |-
{{ .Files.Get "files/init_db.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ $infra.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $infra.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ $infra.postgres.user | quote }}
            {{- include "sage-run.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "PG_PASSWORD") | nindent 12 }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: init_db.sql
              readOnly: true
      volumes:
        - name: init-db
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "sage-run.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ $infra.postgres.storageSize }}
---
{{- end }}
{{- if $infra.objectStore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/component: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      securityContext:
        # The image runs as non-root 65532; this keeps the data volume writable.
        fsGroup: 65532
      containers:
        - name: minio
          image: {{ $infra.objectStore.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: {{ $infra.objectStore.accessKey | quote }}
            {{- include "sage-run.secretEnv" (dict "root" . "name" "MINIO_ROOT_PASSWORD" "key" "OBJECT_STORE_SECRET_KEY") | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "sage-run.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ $infra.objectStore.storageSize }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: create-buckets
          image: {{ $infra.objectStore.image }}
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio:9000 "$OBJECT_STORE_ACCESS_KEY" "$OBJECT_STORE_SECRET_KEY"; do sleep 2; done
              {{- range $infra.objectStore.buckets }}
              mc mb --ignore-existing local/{{ . }}
              {{- end }}
          env:
            - name: HOME
              value: /tmp
            - name: OBJECT_STORE_ACCESS_KEY
              value: {{ $infra.objectStore.accessKey | quote }}
            {{- include "sage-run.secretEnv" (dict "root" . "name" "OBJECT_STORE_SECRET_KEY" "key" "OBJECT_STORE_SECRET_KEY") | nindent 12 }}
---
{{- end }}
{{- if $infra.hindsight.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: hindsight
spec:
  selector:
    app.kubernetes.io/component: hindsight
  ports:
    - name: http
      port: 8888
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: hindsight
  template:
    metadata:
      labels:
        app.kubernetes.io/component: hindsight
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: hindsight
          image: {{ $infra.hindsight.image }}
          ports:
            - name: http
              containerPort: 8888
          env:
            {{- include "sage-run.secretEnv" (dict "root" . "name" "PG_PASSWORD" "key" "PG_PASSWORD") | nindent 12 }}
            {{- include "sage-run.secretEnv" (dict "root" . "name" "HINDSIGHT_API_LLM_API_KEY" "key" "LLM_API_KEY") | nindent 12 }}
            {{- include "sage-run.secretEnv" (dict "root" . "name" "HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY" "key" "LLM_API_KEY") | nindent 12 }}
            - name: HINDSIGHT_API_DATABASE_URL
              value: "postgresql://{{ $infra.postgres.user }}:$(PG_PASSWORD)@postgres:5432/{{ $infra.postgres.database }}"
            {{- $defaults := dict
              "HINDSIGHT_API_LLM_PROVIDER" "openai"
              "HINDSIGHT_API_REFLECT_LLM_TIMEOUT" "120"
              "HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS" "4096"
              "HINDSIGHT_API_REFLECT_MAX_CONTEXT_TOKENS" "48000"
              "HINDSIGHT_API_EMBEDDINGS_OPENAI_BATCH_SIZE" "1"
              "HINDSIGHT_API_DATABASE_SCHEMA" "hindsight"
              "HINDSIGHT_API_WORKER_ID" "sage-run-hindsight"
              "HINDSIGHT_API_VECTOR_EXTENSION" "pgvector"
              "HINDSIGHT_API_RUN_MIGRATIONS_ON_STARTUP" "true"
              "HINDSIGHT_API_RERANKER_LOCAL_MODEL" "cross-encoder/ms-marco-MiniLM-L-6-v2"
              "HINDSIGHT_API_LAZY_RERANKER" "true"
              "HINDSIGHT_API_EMBEDDINGS_PROVIDER" "openai"
              "HINDSIGHT_API_FILE_STORAGE_TYPE" "native" }}
            {{- range $key, $value := merge (deepCopy ($infra.hindsight.env | default dict)) $defaults }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /home/hindsight/.hindsight
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "sage-run.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ $infra.hindsight.storageSize }}
{{- end }}
