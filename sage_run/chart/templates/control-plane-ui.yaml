apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-ui
  labels:
    app.kubernetes.io/component: control-plane-ui
spec:
  replicas: 1
  {{- if .Values.controlPlaneUi.hostPort }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane-ui
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: control-plane-ui
          image: {{ include "sage-run.image" (dict "root" . "component" "control-plane-ui") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlaneUi.port }}
              {{- with .Values.controlPlaneUi.hostPort }}
              hostPort: {{ . }}
              {{- end }}
              {{- with .Values.controlPlaneUi.hostIP }}
              hostIP: {{ . | quote }}
              {{- end }}
          env:
            - name: INTERNAL_GATEWAY_URL
              value: http://gateway:{{ .Values.gateway.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane-ui
spec:
  selector:
    app.kubernetes.io/component: control-plane-ui
  ports:
    - name: http
      port: {{ .Values.controlPlaneUi.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control-plane-ui
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control-plane-ui
                port:
                  name: http
{{- end }}
