{{- if .Values.knowledgeIndexer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-indexer
  labels:
    app.kubernetes.io/component: knowledge-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: knowledge-indexer
  template:
    metadata:
      annotations:
        sage-run/config-checksum: {{ .Values.configChecksum | quote }}
      labels:
        app.kubernetes.io/component: knowledge-indexer
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: knowledge-indexer
          image: {{ include "sage-run.image" (dict "root" . "component" "knowledge-indexer") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            {{- include "sage-run.commonEnv" . | nindent 12 }}
            - name: KNOWLEDGE_SOURCE_INDEXER_CACHE_ROOT
              value: {{ .Values.knowledgeIndexer.cacheRoot | quote }}
            {{- include "sage-run.serviceEnv" (dict "root" $ "name" "knowledge-indexer") | nindent 12 }}
          envFrom:
            {{- include "sage-run.bootstrapEnvFrom" . | nindent 12 }}
          volumeMounts:
            {{- include "sage-run.workflowRepoMount" (dict "writable" false) | nindent 12 }}
            - name: cache
              mountPath: {{ .Values.knowledgeIndexer.cacheRoot }}
      volumes:
        {{- include "sage-run.workflowRepoVolume" . | nindent 8 }}
        - name: cache
          emptyDir: {}
{{- end }}
