apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/component: gateway
spec:
  # Gateway runs the scheduler in-process and must never run twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        sage-run/config-checksum: {{ .Values.configChecksum | quote }}
      labels:
        app.kubernetes.io/component: gateway
    spec:
      {{- include "sage-run.podDefaults" . | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "sage-run.image" (dict "root" . "component" "gateway") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            {{- include "sage-run.commonEnv" . | nindent 12 }}
            - name: WORKFLOW_REPO_DISPLAY_PATH
              value: {{ .Values.workflowRepo.hostPath | quote }}
            - name: SAGE_RUN_BACKUP_HOST_PATH
              value: {{ .Values.backups.hostPath | quote }}
            - name: SAGE_RUN_BACKUP_HINDSIGHT
              value: {{ and .Values.backups.enabled .Values.infrastructure.hindsight.enabled | quote }}
            - name: RUNTIME_BUNDLE_ROOT
              value: {{ .Values.runtimeBundles.root | quote }}
            - name: RUNTIME_BUNDLE_OBJECT_STORE_BUCKET
              value: {{ .Values.runtimeBundles.objectStoreBucket | quote }}
            {{- include "sage-run.serviceEnv" (dict "root" $ "name" "gateway") | nindent 12 }}
          envFrom:
            {{- include "sage-run.bootstrapEnvFrom" . | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          volumeMounts:
            {{- include "sage-run.workflowRepoMount" (dict "writable" (not .Values.deployer.enabled)) | nindent 12 }}
            - name: release-cache
              mountPath: {{ .Values.runtimeBundles.root }}
      volumes:
        {{- include "sage-run.workflowRepoVolume" . | nindent 8 }}
        - name: release-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
