{{- range $name, $mcp := .Values.mcps }}
{{- if $mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-{{ $name }}
  labels:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      annotations:
        sage-run/config-checksum: {{ $.Values.configChecksum | quote }}
      labels:
        app.kubernetes.io/component: mcp
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- include "sage-run.podDefaults" $ | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "sage-run.image" (dict "root" $ "component" "mcp") }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          command: ["python", "-m", "uvicorn", "{{ $mcp.module }}:app", "--host", "0.0.0.0", "--port", "{{ $mcp.port }}"]
          ports:
            - name: http
              containerPort: {{ $mcp.port }}
          env:
            {{- include "sage-run.commonEnv" $ | nindent 12 }}
            {{- include "sage-run.serviceEnv" (dict "root" $ "name" (printf "mcp-%s" $name)) | nindent 12 }}
            {{- if eq $name "knowledge" }}
            - name: KNOWLEDGE_SOURCE_SERVING_CACHE_ROOT
              value: {{ $.Values.knowledgeMcp.cacheRoot | quote }}
            {{- end }}
          envFrom:
            {{- include "sage-run.bootstrapEnvFrom" $ | nindent 12 }}
          volumeMounts:
            {{- include "sage-run.workflowRepoMount" (dict "writable" false) | nindent 12 }}
            {{- if eq $name "knowledge" }}
            - name: knowledge-cache
              mountPath: {{ $.Values.knowledgeMcp.cacheRoot }}
            {{- end }}
      volumes:
        {{- include "sage-run.workflowRepoVolume" $ | nindent 8 }}
        {{- if eq $name "knowledge" }}
        - name: knowledge-cache
          persistentVolumeClaim:
            claimName: knowledge-cache
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-{{ $name }}
spec:
  selector:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $mcp.port }}
      targetPort: http
---
{{- end }}
{{- end }}
