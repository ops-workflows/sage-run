{{- range $name, $connector := .Values.connectors }}
{{- if $connector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $connector.component }}
  labels:
    app.kubernetes.io/component: connector
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: connector
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      annotations:
        sage-run/config-checksum: {{ $.Values.configChecksum | quote }}
      labels:
        app.kubernetes.io/component: connector
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- include "sage-run.podDefaults" $ | nindent 6 }}
      containers:
        - name: connector
          image: {{ include "sage-run.image" (dict "root" $ "component" $connector.component) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          env:
            {{- include "sage-run.commonEnv" $ | nindent 12 }}
            {{- include "sage-run.serviceEnv" (dict "root" $ "name" $connector.component) | nindent 12 }}
          envFrom:
            {{- include "sage-run.bootstrapEnvFrom" $ | nindent 12 }}
          volumeMounts:
            {{- include "sage-run.workflowRepoMount" (dict "writable" false) | nindent 12 }}
      volumes:
        {{- include "sage-run.workflowRepoVolume" $ | nindent 8 }}
---
{{- end }}
{{- end }}
